[build-system]
requires = [
    "hatchling",
    "versioningit",
    "hatch-protobuf==0.5.0",
    "grpcio-tools==1.80.0",
    "grpcio==1.80.0"
]
build-backend = "hatchling.build"

# Ensure that only the generated/copied files from CreateSonIDLPackage.py go into the package.
[tool.hatch.build.targets.sdist]
packages = ["sonardyne_api"]

[tool.hatch.version]
source = "versioningit"

[tool.versioningit]
default-version = "0.0.0"

[tool.versioningit.format]
distance = "{version}.dev.{distance}"
dirty = "{version}"
distance-dirty = "{version}.dev.{distance}"

[tool.hatch.build.hooks.custom]
# required for hatch-protobuf
dependencies = [
    "grpcio==1.80.0",
    "grpcio-tools==1.80.0",
    "hatch-protobuf==0.5.0"
]
proto_paths = ["protos"]
output_path = "sonardyne_api/"
# required for wrapper around hatch-protobuf
proto_paths_source = ["../../../protos"]
exclude_dirs = ["^.*_docs$", "^release$"]

[project]
name = "sonardyne_api"
description = "Sonardyne gRPC / Protocol Buffer API"
dynamic = ["version"]
maintainers = [
  { name = "Sonardyne" },
]
requires-python = ">=3.14"

dependencies = [
    "grpcio==1.81.0",
    "protobuf==6.33.5",
    "cobs==1.2.2",
    "pyserial==3.5"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/Sonardyne/son-idl"
Documentation = "https://sonardyne.github.io/son-idl/"
"Bug Tracker" = "https://github.com/Sonardyne/son-idl/issues"

