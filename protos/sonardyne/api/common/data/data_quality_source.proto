syntax = "proto3";

package sonardyne.api.common.data;

// DataQualitySource enumerates the different modes for determining the quality of inbound data.
enum DataQualitySource {
  // Unspecified quality source.
  DATA_QUALITY_SOURCE_UNSPECIFIED = 0;
  // Use an automatically determined quality.
  DATA_QUALITY_SOURCE_AUTO = 1;
  // Use quality values sourced from input data.
  DATA_QUALITY_SOURCE_DATA = 2;
  // Use a manually specified quality value.
  DATA_QUALITY_SOURCE_MANUAL = 3;
}
