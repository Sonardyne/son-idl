syntax = "proto3";

import "sonardyne/api/common/installation/lever_arms.proto";
import "sonardyne/api/common/unique_id.proto";
import "sonardyne/api/sources/depth_source/depth_data_reference.proto";

package sonardyne.api.sources.depth_source;

// DepthSourceConfiguration represents the configuration of a depth source.
// It defines the unique identifier for the depth source, a reference to the
// input depth data source, and the lever arms from the vessel reference point.
// This message is deprecated, and is replaced by InternalDepthSourceConfiguration
// and ExternalDepthSourceConfiguration.
message DepthSourceConfiguration {
  option deprecated                                         = true;  // This message is deprecated as of version 2.1.0.

  // Deprecated. DepthSourceConfiguration.PressureToDepthConversion controls how the DepthSource calculates depth from a pressure sensor reading.
  enum PressureToDepthConversion {
    option deprecated = true;  // This enum is deprecated as of version 2.1.0.
    // Pressure to depth conversion method not specified.
    PRESSURE_TO_DEPTH_CONVERSION_UNSPECIFIED = 0;
    // Depth calculated by applying fixed scaling to pressure message.
    PRESSURE_TO_DEPTH_CONVERSION_FIXED_SCALING = 1;
    // Depth calculated externally and streamed in as PressureSensorObservations.
    PRESSURE_TO_DEPTH_CONVERSION_EXTERNAL = 2;
  }

  // Unique identifier of the depth source.
  sonardyne.api.common.UniqueID uid = 1;
  // Deprecated. Input depth data source reference is no longer configured here and will be removed in a later version.
  optional DepthDataSourceReference input_depth_data_source_reference = 2 [deprecated = true];
  // Deprecated. Lever arms is no longer configured here and will be removed in a later version.
  optional sonardyne.api.common.installation.LeverArms lever_arms = 3 [deprecated = true];
  // Deprecated. Manual depth offset applied to incoming data.
  optional double manual_depth_offset_metres = 4 [deprecated = true];
  // Deprecated. Pressure to depth conversion method to use. Only applicable when input depth source is a pressure sensor.
  optional PressureToDepthConversion pressure_to_depth_conversion = 5 [deprecated = true];
}
