syntax = "proto3";

import "sonardyne/api/common/navigation/geographic_coordinates.proto";
import "sonardyne/api/common/unique_id.proto";
import "sonardyne/api/sources/snap_source/snap_source.proto";

package sonardyne.api.sources.snap_source;

// SnapSourceCommandSendSnap commands the SPRINT-Nav to snap its position to a supplied or recently received horizontal
// position.
// Source field behaviour:
//  - SNAP_SOURCE_GNSS / SNAP_SOURCE_USBL / SNAP_SOURCE_XPOS: the most recent position received from that source is
//    used, provided it was received within a fixed timeout. `position` and `horizontal_position_uncertainty_metres` are ignored.
//  - SNAP_SOURCE_MANUAL: `position` and `horizontal_position_uncertainty_metres` must both be supplied.
message SnapSourceCommandSendSnap {
  // Client-generated ID, returned in the command response so the request can be matched.
  sonardyne.api.common.UniqueID uid = 1;
  // Source of the snap position.
  SnapSource source = 2;
  // Position to snap to.  Lat/Lon in radians. Used when source is SNAP_SOURCE_MANUAL.
  sonardyne.api.common.navigation.GeographicCoordinates position = 3;
  // Horizontal position uncertainty, 1 standard deviation (1σ), metres. Used when source is SNAP_SOURCE_MANUAL.
  double horizontal_position_uncertainty_metres = 4;
}
