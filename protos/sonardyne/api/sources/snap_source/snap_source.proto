syntax = "proto3";

package sonardyne.api.sources.snap_source;

// SnapSource selects the source of the position used by a snap command.
enum SnapSource {
  // Not set. Rejected by commands.
  SNAP_SOURCE_UNSPECIFIED = 0;
  // Snap to the most recent position accepted from the GNSS aiding input.
  SNAP_SOURCE_GNSS = 1;
  // Snap to the most recent position accepted from the USBL aiding input.
  SNAP_SOURCE_USBL = 2;
  // Snap to the most recent position accepted from the external position (XPOS) input.
  SNAP_SOURCE_XPOS = 3;
  // Snap to the position and uncertainty supplied in the command.
  SNAP_SOURCE_MANUAL = 4;
};
