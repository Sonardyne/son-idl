syntax = "proto3";

import "sonardyne/api/common/unique_id.proto";

package sonardyne.api.sources.time_source;

// ZdaTimeSourceStatus represents the status for a ZDA time source.
// It includes the unique identifier of the source which relates this message to other ZdaTimeSource messages.
message ZdaTimeSourceStatus {
  // ZdaTimeSourceStatus.ZdaReasonsRejected represents the bitmask of reasons ZDA data may be rejected.
  message ZdaReasonsRejected {
    // No ZDA rejection reasons.
    bool none = 1;
    // Rejected due to too few observations received in window.
    bool too_few_obs = 2;
    // Rejected due to uncertainty in ZDA messages being too high.
    bool uncertainty_too_high = 3;
  }
  // Unique identifier of the ZDA time source.
  sonardyne.api.common.UniqueID uid = 4;
  // Reasons ZDA messages were rejected.
  ZdaReasonsRejected reasons_rejected = 5;
  // ZDA derived UTC minus instrument time.
  double derived_utc_minus_instrument_time_seconds = 6;
  // 1σ of uncertainty of the derived utc time.
  double derived_utc_uncertainty_seconds = 7;
  // 1σ of uncertainty of the incoming ZDA message time.
  double zda_message_uncertainty_seconds = 8;
  // Median latency of incoming ZDA messages.
  double zda_message_median_latency_seconds = 9;
  // Number of observations processed in the last window.
  uint32 num_observations_in_window = 10;
  // Seconds since valid time estimate.
  double time_since_valid_estimate_seconds = 11;
}
