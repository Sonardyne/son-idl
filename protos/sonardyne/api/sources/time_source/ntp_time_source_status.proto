syntax = "proto3";

import "sonardyne/api/common/unique_id.proto";
import "sonardyne/api/sources/time_source/ntp_peer_info.proto";

package sonardyne.api.sources.time_source;

// NtpTimeSourceStatus represents the status for an NTP (Network Time Protocol) time source.
// It includes the unique identifier of the source which relates this message to other NtpTimeSource messages.
message NtpTimeSourceStatus {
  // Unique identifier of the NTP time source.
  sonardyne.api.common.UniqueID uid = 1;
  // NTP peer information.
  repeated NtpPeerInfo peers_info = 2;
}
