syntax = "proto3";

import "sonardyne/api/common/ports/trigger_port/trigger_edge.proto";
import "sonardyne/api/common/unique_id.proto";

package sonardyne.api.sources.time_source;

// PpsTimeSourceStatus represents the status for a PPS time source.
// It includes the unique identifier of the source which relates this message to other PpsTimeSource messages.
message PpsTimeSourceStatus {
  // PpsTimeSourceStatus.PpsReasonsRejected represents the bitmask of reasons PPS data may be rejected.
  message PpsReasonsRejected {
    // No PPS rejection reasons.
    bool none = 1;
    // Rejected due to too few observations received in window.
    bool too_few_obs = 2;
    // Rejected due to uncertainty in PPS messages being too high.
    bool uncertainty_too_high = 3;
    // Rejected observation timestamped in future.
    bool obs_from_future = 4;
  }
  // Unique identifier of the PPS time source.
  sonardyne.api.common.UniqueID uid = 1;
  // Reasons PPS messages were rejected.
  PpsReasonsRejected reasons_rejected = 2;
  // PPS derived UTC minus instrument time.
  double filtered_pps_fractional_seconds = 3;
  // 1σ of uncertainty of the incoming PPS message time.
  double pps_message_uncertainty_seconds = 4;
  // Edge of the PPS trigger used.
  sonardyne.api.common.ports.trigger_port.TriggerEdge pps_trigger_edge = 5;
  // Number of observations processed in the last window.
  uint32 num_observations_in_window = 6;
}
