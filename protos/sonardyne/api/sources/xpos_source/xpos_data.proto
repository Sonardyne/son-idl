syntax = "proto3";

import "sonardyne/api/common/navigation/horizontal_position_error_ellipse.proto";
import "sonardyne/api/common/timestamp.proto";
import "sonardyne/api/sources/xpos_source/xpos_source.proto";

package sonardyne.api.sources.xpos_source;

// XposData represents a measured position from an XPOS system at a specific time.
// The message includes latitude, longitude, depth, associated uncertainties,
// and the source of the XPOS data.
message XposData {
  // Time at which the XPOS data is valid.
  sonardyne.api.common.Timestamp time_of_validity = 1;
  // Latitude in radians.
  double latitude_radians = 2;
  // Longitude in radians.
  double longitude_radians = 3;
  // Horizontal position uncertainty in 2D as an ellipse or in 1D as metres.
  oneof horizontal_position_uncertainty {
    // Error ellipse for horizontal position.
    sonardyne.api.common.navigation.HorizontalPositionErrorEllipse horizontal_position_uncertainty_ellipse = 4;
    // 1σ of horizontal uncertainty in metres.
    double horizontal_position_uncertainty_metres = 5;
  }
  // Depth in metres.
  double depth_metres = 6;
  // 1σ of depth uncertainty in metres.
  double depth_uncertainty_metres = 7;
  // Source of the XPOS data.
  XposSource source = 8;
}
