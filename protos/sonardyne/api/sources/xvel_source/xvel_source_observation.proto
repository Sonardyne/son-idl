syntax = "proto3";

import "sonardyne/api/common/timestamp.proto";
import "sonardyne/api/common/unique_id.proto";
import "sonardyne/api/sources/xvel_source/xvel_data.proto";

package sonardyne.api.sources.xvel_source;

// XvelSourceObservation represents an observation from an XVEL source.
// It includes a unique identifier for the source, the time of arrival of the data,
// and the XVEL measurement data itself.
message XvelSourceObservation {
  // Unique identifier of the XVEL source.
  sonardyne.api.common.UniqueID uid = 1;
  // Time of arrival of the data;  set if not provided.
  optional sonardyne.api.common.Timestamp time_of_arrival = 2;
  // XVEL measurement data.
  sonardyne.api.sources.xvel_source.XvelData xvel_data = 3;
}
