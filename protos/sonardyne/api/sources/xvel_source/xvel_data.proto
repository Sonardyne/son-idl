syntax = "proto3";

import "sonardyne/api/common/maths/vector_3d.proto";
import "sonardyne/api/common/timestamp.proto";

package sonardyne.api.sources.xvel_source;

// XvelData represents a measured velocity from an XVEL system at a specific time.
// The message includes a velocity and the uncertainty for that velocity measurement.
message XvelData {
  // Reference frame of XVEL velocity data.
  enum XvelVelocityReferenceFrame {
    // Unspecified XVEL velocity reference frame.
    XVEL_VELOCITY_REFERENCE_FRAME_UNSPECIFIED = 0;
    // XVEL velocity is in body frame where x-y-z is forward-starboard-down.
    XVEL_VELOCITY_REFERENCE_FRAME_BODY_FRAME = 1;
    // XVEL velocity is in earth frame where x-y-z is north-east-down.
    XVEL_VELOCITY_REFERENCE_FRAME_EARTH_FRAME = 2;
  }
  // Time at which the XVEL data is valid.
  sonardyne.api.common.Timestamp time_of_validity = 1;
  // XYZ velocity in metres per second in the reference frame.
  sonardyne.api.common.maths.Vector3d velocity_metres_per_second = 2;
  // XYZ velocity uncertainty, where each field is 1σ of uncertainty in the reference frame.
  sonardyne.api.common.maths.Vector3d velocity_uncertainty_metres_per_second = 3;
  // Reference frame of the XVEL velocity.
  XvelVelocityReferenceFrame velocity_reference_frame = 4;
  // Water relative: false for ground-relative, true for water-relative.
  bool is_water_relative_velocity = 5;
}
