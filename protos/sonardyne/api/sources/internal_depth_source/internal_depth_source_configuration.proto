syntax = "proto3";

import "sonardyne/api/common/unique_id.proto";
import "sonardyne/api/sources/depth_source/pressure_to_depth_conversion.proto";

package sonardyne.api.sources.internal_depth_source;

// InternalDepthSourceConfiguration represents the configuration of an internal depth source.
// Includes data port reference, lever arms, uncertainty handling.
message InternalDepthSourceConfiguration {
  // Unique identifier of the internal depth source.
  sonardyne.api.common.UniqueID uid = 1;
  // Manual depth offset applied to incoming data.
  optional double manual_depth_offset_metres = 2;
  // Pressure to depth conversion method for internal pressure sensor data.
  optional sonardyne.api.sources.depth_source.PressureToDepthConversion pressure_to_depth_conversion = 3;
}
