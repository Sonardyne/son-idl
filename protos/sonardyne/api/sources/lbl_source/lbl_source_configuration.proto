syntax = "proto3";

import "sonardyne/api/common/installation/lever_arms.proto";
import "sonardyne/api/common/ports/data_port_reference.proto";
import "sonardyne/api/common/unique_id.proto";

package sonardyne.api.sources.lbl_source;

// LblSourceConfiguration represents the configuration of an LBL source, including its unique identifier,
// reference to the input data port, and lever arms from the vessel reference point.
message LblSourceConfiguration {
  // Unique identifier of the LBL source.
  sonardyne.api.common.UniqueID uid = 1;
  // Reference to the input data port providing LBL data.
  optional sonardyne.api.common.ports.DataPortReference input_data_port = 2;
  // Lever arms from the vessel reference point.
  optional sonardyne.api.common.installation.LeverArms lever_arms = 3;
  // Known latency to correct for.
  optional double fixed_latency_seconds = 4;
  // Minimum signal-to-noise ratio.
  optional double min_signal_to_noise_ratio_decibels = 5;
  // Maximum reduced relative signal-to-noise ratio (low-pass filtered).
  optional double max_reduced_signal_to_noise_ratio_decibels = 6;
  // Minimum signal level.
  optional double min_signal_level_decibels = 7;
  // Maximum reduced relative signal level (low-pass filtered).
  optional double max_reduced_signal_level_decibels = 8;
  // Low-pass filter time constant.
  optional double tau = 9;
  // Minimum correlation score (0-100%).
  optional double min_correlation_score = 10;
  // Number of recent ranges to a beacon to start using ranges as aiding.
  optional uint32 required_recent_observations = 11;
  // Time window for ranges to be considered "recent".
  optional double recent_window_seconds = 12;
  // Minimum distance from a beacon to use ranges.
  optional double min_distance_metres = 13;
  // Maximum distance from a beacon to use ranges.
  optional double max_distance_metres = 14;
  // Maximum range rate.
  optional double max_relative_speed_metres_per_second = 15;
  // Maximum range prediction error.
  optional double max_predicted_distance_error_metres = 16;
}
