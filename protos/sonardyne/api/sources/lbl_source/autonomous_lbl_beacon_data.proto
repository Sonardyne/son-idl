syntax = "proto3";

import "sonardyne/api/common/navigation/geographic_coordinates.proto";

package sonardyne.api.sources.lbl_source;

// LBL data describing a beacon, its position and position error estimates, relevant acoustic properties and its mode of operation.
message AutonomousLblBeaconData {
    // Address of the beacon.
    uint32 address = 1;
    // Horizontal position of the beacon.
    sonardyne.api.common.navigation.GeographicCoordinates horizontal_position = 2;
    // Vertical position of beacon as metres of depth below the surface.
    double depth_metres = 3;
    // Turn around time of the beacon in seconds.
    double turn_around_time_seconds = 4;
    // Whether the beacon is enabled for use.
    bool is_enabled = 5;
}
