syntax = "proto3";

import "sonardyne/api/common/timestamp.proto";
import "sonardyne/api/common/unique_id.proto";
import "sonardyne/api/sources/lbl_source/autonomous_lbl_beacon_data.proto";
import "sonardyne/api/sources/lbl_source/autonomous_lbl_range_data.proto";

package sonardyne.api.sources.lbl_source;

// AutonomousLblSourceObservation is data from a LBL source, including range information and/or beacon information.
// Contains the unique ID of the LBL source and the timestamp of data arrival.
message AutonomousLblSourceObservation {
  // Unique identifier of the LBL source.
  sonardyne.api.common.UniqueID uid = 1;
  // Timestamp when the data arrived.
  optional sonardyne.api.common.Timestamp time_of_arrival = 2;
  // LBL observation data.
  oneof data {
    // Range data from the LBL source.
    AutonomousLblRangeData range_data = 3;
    // Beacon data from the LBL source.
    AutonomousLblBeaconData beacon_data = 4;
  };
}
