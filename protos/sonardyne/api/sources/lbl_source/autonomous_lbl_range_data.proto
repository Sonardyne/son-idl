syntax = "proto3";

import "sonardyne/api/common/timestamp.proto";

package sonardyne.api.sources.lbl_source;

// Range data from an LBL source. Describes a single range measurement to a beacon with associated parameters and diagnostics.
message AutonomousLblRangeData {
    // Timestamp when the data was valid;  .
    sonardyne.api.common.Timestamp time_of_validity = 1;
    // Address of the target beacon.
    uint32 address = 2;
    // Measured two-way travel time (including turn around time) in seconds.
    double travel_time_seconds = 3;
    // Sound velocity at the beacon in metres per second.
    double beacon_sound_velocity_metres_per_second = 4;
    // Average sound velocity used to calculate range in metres per second.
    double range_sound_velocity_metres_per_second = 5;
    // Cross correlation value of the received signal as a percentage (0.0 to 100.0).
    double cross_correlation = 6;
    // Signal to noise ratio in dBV.
    double signal_to_noise_ratio_dbv = 7;
    // Signal level.
    double signal_level = 8;
    // Indicates if the range data is valid.
    bool   valid = 9;
}
