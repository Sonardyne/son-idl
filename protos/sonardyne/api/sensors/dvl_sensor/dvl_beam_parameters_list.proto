syntax = "proto3";

import "sonardyne/api/sensors/dvl_sensor/dvl_beam_parameters.proto";

package sonardyne.api.sensors.dvl_sensor;

// DvlBeamParametersList represents a collection of DVL beam parameters.
// Each entry in the list corresponds to the orientation parameters of a single DVL beam.
message DvlBeamParametersList {
  // List of DVL beam parameters for all beams.
  repeated DvlBeamParameters dvl_beam_parameters = 1;
}
