syntax = "proto3";

import "sonardyne/api/common/installation/lever_arms.proto";
import "sonardyne/api/common/installation/mounting_angles.proto";
import "sonardyne/api/common/unique_id.proto";
import "sonardyne/api/sensors/dvl_sensor/dvl_beam_parameters_list.proto";

package sonardyne.api.sensors.dvl_sensor;

// DvlSensorConfiguration represents the configuration parameters for a Doppler Velocity Log (DVL) sensor.
// It includes a unique identifier, physical installation details, beam parameters, and logging options.
message DvlSensorConfiguration {
  // Unique identifier of the DVL sensor.
  sonardyne.api.common.UniqueID uid = 1;
  // Lever arms from the instrument reference point in metres.
  optional sonardyne.api.common.installation.LeverArms lever_arms = 2;
  // Mounting angles in the instrument frame, in radians.
  optional sonardyne.api.common.installation.MountingAngles mounting_angles = 3;
  // Parameters for all DVL beams.
  optional DvlBeamParametersList dvl_beam_parameters_list = 4;
  // Toggle raw DVL data logging.
  optional bool is_raw_logging_enabled = 5;
}
