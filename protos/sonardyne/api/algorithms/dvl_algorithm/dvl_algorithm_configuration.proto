syntax = "proto3";

import "sonardyne/api/algorithms/dvl_algorithm/dvl_adcp_parameters.proto";
import "sonardyne/api/algorithms/dvl_algorithm/dvl_input_trigger_parameters.proto";
import "sonardyne/api/algorithms/dvl_algorithm/dvl_mode.proto";
import "sonardyne/api/algorithms/dvl_algorithm/dvl_rate.proto";
import "sonardyne/api/common/bounded_values/bounded_double.proto";
import "sonardyne/api/common/unique_id.proto";

package sonardyne.api.algorithms.dvl_algorithm;

// DvlAlgorithmConfiguration provides configuration for a DVL algorithm, including
// update rate, Doppler mode, input trigger settings, and ADCP-related parameters.
message DvlAlgorithmConfiguration {
  // Unique identifier for this DVL algorithm instance.
  sonardyne.api.common.UniqueID uid = 1;
  // Maximum update rate of the DVL algorithm. Ignored if input trigger edge set to rising or falling.
  optional DvlRate dvl_rate = 2;
  // Operating mode of the DVL (e.g., DVL, ADCP, or combined).
  optional DvlMode dvl_mode = 3;
  // Input trigger configuration controlling measurement timing.
  optional DvlInputTriggerParameters input_trigger_parameters = 4;
  // ADCP-related parameters for ADCP or DVL+ADCP operation.
  optional DvlAdcpParameters adcp_parameters = 5;
  // Blanking distance in metres, to specify a minimum altitude for the DVL algorithm.
  optional sonardyne.api.common.bounded_values.BoundedDouble dvl_blanking_distance_metres = 6;
}
