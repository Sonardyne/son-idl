syntax = "proto3";

package sonardyne.api.algorithms.ins_algorithm;

// InsAlgorithmStatusFreeInertial contains data from the INS algorithm about predicted free inertial performance: time for uncertainty to reach 1NM, CEP50.
message InsAlgorithmStatusFreeInertial {
  // InsAlgorithmStatusFreeInertial.FreeInertialStatus provides classification fields for predicted free-inertial performance
  enum FreeInertialStatus {
    // Free inertial status unspecified
    FREE_INERTIAL_STATUS_UNSPECIFIED = 0;
    // Free inertial status disabled
    FREE_INERTIAL_STATUS_DISABLED = 1;
    // Free inertial status initial
    FREE_INERTIAL_STATUS_INITIAL = 2;
    // Free inertial status good
    FREE_INERTIAL_STATUS_GOOD = 3;
    // Free inertial status excellent
    FREE_INERTIAL_STATUS_EXCELLENT = 4;
    // Free inertial status optimal
    FREE_INERTIAL_STATUS_OPTIMAL = 5;
  }

  // Predicted time in seconds for an INS algorithm solution to reach 1NM CEP50 uncertainty
  double time_to_1nm_cep50_uncertainty_seconds = 1;
  // Classification of an INS algorithm's expected time to reach 1NM CEP50 uncertainty
  FreeInertialStatus free_inertial_status = 2;
}
