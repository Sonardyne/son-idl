syntax = "proto3";

import "sonardyne/api/algorithms/ins_algorithm/ins_algorithm_status_dvl.proto";
import "sonardyne/api/algorithms/ins_algorithm/ins_algorithm_status_free_inertial.proto";
import "sonardyne/api/algorithms/ins_algorithm/ins_algorithm_status_gnss.proto";
import "sonardyne/api/algorithms/ins_algorithm/ins_algorithm_status_lbl_beacon.proto";
import "sonardyne/api/algorithms/ins_algorithm/ins_algorithm_status_pressure.proto";
import "sonardyne/api/algorithms/ins_algorithm/ins_algorithm_status_susbl.proto";
import "sonardyne/api/algorithms/ins_algorithm/ins_algorithm_status_xpos.proto";
import "sonardyne/api/algorithms/ins_algorithm/ins_algorithm_status_xvel.proto";
import "sonardyne/api/common/unique_id.proto";

package sonardyne.api.algorithms.ins_algorithm;

// InsAlgorithmStatus contains data from the INS algorithm about the aiding used in a Kalman cycle.
message InsAlgorithmStatus {
  // Unique ID of the INS algorithm.
  sonardyne.api.common.UniqueID uid = 1;
  // Status of the DVL aiding for this cycle.
  InsAlgorithmStatusDvl dvl = 2;
  // Status of the GNSS aiding for this cycle.
  InsAlgorithmStatusGnss gnss = 3;
  // Status of the Internal Pressure aiding for this cycle.
  InsAlgorithmStatusPressure internal_pressure = 4;
  // Status of the External Pressure/Depth aiding for this cycle.
  InsAlgorithmStatusPressure external_pressure_depth = 5;
  // Status of the SUSBL aiding for this cycle.
  InsAlgorithmStatusSusbl susbl = 6;
  // Status of the XPOS aiding for this cycle.
  InsAlgorithmStatusXpos xpos = 7;
  // Status of the XVEL aiding for this cycle.
  InsAlgorithmStatusXvel xvel = 8;
  // Statuses of the aiding from each LBL beacon for this cycle.
  repeated InsAlgorithmStatusLblBeacon lbl_beacons = 9;
  // Whether the fix machine that is used to initialise the INS's position is running.
  bool is_ins_fix_machine_running = 10;
  // Status of the predicted INS free inertial performance.
  InsAlgorithmStatusFreeInertial free_inertial = 11;
}
