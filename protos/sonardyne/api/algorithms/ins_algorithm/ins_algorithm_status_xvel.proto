syntax = "proto3";

package sonardyne.api.algorithms.ins_algorithm;

// InsAlgorithmStatusXvel contains data from the INS algorithm about the XVEL aiding used in a Kalman cycle.
message InsAlgorithmStatusXvel {
  // InsAlgorithmStatusXvel.ReasonsRejected defines one or more reasons for XVEL data being rejected by an INS.
  message ReasonsRejected {
    // XVEL data rejected due to bad time tag.
    bool bad_time_tag = 1;
    // XVEL data rejected due to acceleration limit.
    bool acceleration_limit = 2;
    // XVEL data rejected due to velocity limit.
    bool velocity_limit = 3;
    // XVEL data rejected due to uncertainty limit.
    bool uncertainty_limit = 4;
    // XVEL data rejected due to missing field.
    bool missing_field = 5;
    // XVEL data rejected due to timeout.
    bool timeout = 6;
    // XVEL data rejected as disabled.
    bool disabled = 7;
    // XVEL data rejected due to sigma rejection.
    bool sigma = 8;
  }

  // Mean average of the normalised residuals of observations processed by the algorithm this cycle.
  double mean_normalised_residual = 1;
  // Count of the number of observations accepted and used by the algorithm this cycle.
  int32 observations_accepted_count = 2;
  // Count of the number of observations rejected by the algorithm this cycle.
  int32 observations_rejected_count = 3;
  // Time of validity of the last observation used by the algorithm this cycle.
  double last_used_time_of_validity = 4;
  // Reasons observations were rejected by the algorithm this cycle.
  ReasonsRejected reasons_rejected = 5;
  // Time of validity of the last observation processed by the algorithm this cycle.
  double last_processed_time_of_validity = 6;
}
