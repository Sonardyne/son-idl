syntax = "proto3";

package sonardyne.api.algorithms.ins_algorithm;

// InsAlgorithmStatusDvl contains data from the INS algorithm about the DVL aiding used in a Kalman cycle.
message InsAlgorithmStatusDvl {
  // InsAlgorithmStatusDvl.ReasonsRejected defines one or more reasons for DVL data being rejected by an INS.
  message ReasonsRejected {
    // DVL data rejected due to zero range.
    bool zero_range = 1;
    // DVL data rejected due to zero velocity.
    bool zero_velocity = 2;
    // DVL data rejected due to time delta.
    bool time_delta = 3;
    // DVL data rejected due to velocity change.
    bool velocity_change = 4;
    // DVL data rejected due to invalid status.
    bool invalid_status = 5;
    // DVL data rejected due to Janus error.
    bool janus_error = 6;
    // DVL data rejected due to all beams being rejected.
    bool all_beams = 7;
    // DVL data rejected due to timeout.
    bool timeout = 8;
    // DVL data rejected as disabled.
    bool disabled = 9;
    // DVL data rejected due to sigma rejection.
    bool sigma = 10;
  }

  // Mean average of the normalised residuals of observations processed by the algorithm this cycle.
  double mean_normalised_residual = 1;
  // Count of the number of observations accepted and used by the algorithm this cycle.
  int32 observations_accepted_count = 2;
  // Count of the number of observations rejected by the algorithm this cycle.
  int32 observations_rejected_count = 3;
  // Time of validity of the last observation used by the algorithm this cycle.
  double last_used_time_of_validity = 4;
  // Reasons observations were rejected by the algorithm this cycle.
  ReasonsRejected reasons_rejected = 5;
  // Time of validity of the last observation processed by the algorithm this cycle.
  double last_processed_time_of_validity = 6;
}
