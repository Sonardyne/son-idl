syntax = "proto3";

package sonardyne.api.algorithms.dvl_filter_algorithm;

// DvlFilterRejectionReasons represents the reasons for a rejection of DVL data.
message DvlFilterRejectionReasons {
  // No rejection. The observation was accepted.
  bool none = 1;
  // Miscellaneous rejection reason.
  optional bool rejection_reason_unspecified = 2;
  // Rejection due to zero range.
  optional bool rejection_reason_zero_range = 3;
  // Rejection due to zero velocity.
  optional bool rejection_reason_zero_velocity = 4;
  // Rejection due to time delta.
  optional bool rejection_reason_time_delta = 5;
  // Rejection due to velocity change.
  optional bool rejection_reason_velocity_change = 6;
  // Rejection due to invalid status.
  optional bool rejection_reason_invalid_status = 7;
  // Rejection due to Janus error.
  optional bool rejection_reason_janus_error = 8;
  // Rejection due to all beams.
  optional bool rejection_reason_all_beams = 9;
}
