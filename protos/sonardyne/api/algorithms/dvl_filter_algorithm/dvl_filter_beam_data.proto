syntax = "proto3";

import "sonardyne/api/algorithms/dvl_filter_algorithm/dvl_filter_beam_rejection_reasons.proto";
import "sonardyne/api/common/timestamp.proto";

package sonardyne.api.algorithms.dvl_filter_algorithm;

// DvlFilterBeamData provides detailed information for a single DVL beam measurement,
// including timestamp, velocity, uncertainty, range, correlation score, and any rejection reasons.
message DvlFilterBeamData {
  // Timestamp indicating when the data is valid.
  sonardyne.api.common.Timestamp time_of_validity = 1;
  // Beam number (typically 1 to 4).
  uint32 beam_number = 2;
  // Measured velocity by this DVL beam in metres per second.
  double velocity_metres_per_second = 3;
  // 1σ of uncertainty of the measured velocity in metres per second.
  double velocity_uncertainty_metres_per_second = 4;
  // Measured range from DVL to target along the beam in metres.
  double slant_range_metres = 5;
  // Correlation score of the processed signal, indicating quality.
  double cross_correlation_score = 6;
  // Reasons for rejecting this beam's data;  empty if valid.
  DvlFilterBeamRejectionReasons rejection_reasons = 7;
}
