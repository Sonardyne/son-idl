syntax = "proto3";

package sonardyne.api.algorithms.dvl_filter_algorithm;

// DvlFilterBeamRejectionReasons represents the reasons for a rejection of individual DVL beam data.
message DvlFilterBeamRejectionReasons {
  // No rejection. The observation was accepted.
  bool none = 1;
  // Miscellaneous rejection reason.
  optional bool rejection_reason_unspecified = 2;
  // Rejection due to beam being disabled.
  optional bool rejection_reason_disabled = 3;
  // Rejection due to bad data.
  optional bool rejection_reason_bad_data = 4;
  // Rejection due to timeout.
  optional bool rejection_reason_timeout = 5;
  // Rejection due to velocity change.
  optional bool rejection_reason_velocity_change = 6;
  // Rejection due to low cross correlation.
  optional bool rejection_reason_cross_correlation = 7;
  // Rejection due to low signal to noise ratio.
  optional bool rejection_reason_signal_to_noise = 8;
  // Rejection due to low signal level.
  optional bool rejection_reason_signal_level = 9;
  // Rejection due to velocity error.
  optional bool rejection_reason_velocity_error = 10;
}
