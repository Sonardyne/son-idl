syntax = "proto3";

import "sonardyne/api/common/unique_id.proto";

package sonardyne.api.algorithms.ahrs_algorithm;

// AhrsAlgorithmStatus contains data from the AHRS algorithm about its alignment progress.
message AhrsAlgorithmStatus {
  // Unique ID of the AHRS algorithm.
  sonardyne.api.common.UniqueID uid = 1;
  // Whether the heading quality threshold for the INS to start running has been reached yet.
  bool is_aligned = 2;
  // Percentage (0-100) the AHRS has progressed towards completion.
  double percent_complete = 3;
}
