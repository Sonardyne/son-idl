syntax = "proto3";

import "sonardyne/api/algorithms/gnss_filter_algorithm/filtered_gnss_data.proto";
import "sonardyne/api/common/unique_id.proto";

package sonardyne.api.algorithms.gnss_filter_algorithm;

// GnssFilterAlgorithmObservation provides filtered GNSS data from a GNSS filter algorithm,
// including a unique algorithm identifier and the processed measurement data.
message GnssFilterAlgorithmObservation {
  // Unique identifier of the associated GNSS filter algorithm.
  sonardyne.api.common.UniqueID uid = 1;
  // Filtered GNSS measurement data from the algorithm.
  FilteredGnssData filtered_gnss_data = 2;
}
