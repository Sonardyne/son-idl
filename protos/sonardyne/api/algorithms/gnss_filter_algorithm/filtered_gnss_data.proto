syntax = "proto3";

import "sonardyne/api/algorithms/gnss_filter_algorithm/gnss_filter_rejection_reasons.proto";
import "sonardyne/api/common/navigation/horizontal_position_error_ellipse.proto";
import "sonardyne/api/common/timestamp.proto";

package sonardyne.api.algorithms.gnss_filter_algorithm;

// FilteredGnssData provides processed GNSS measurement data, including position, altitude,
// uncertainty, quality source, timestamps, and any rejection reasons.
message FilteredGnssData {
  // GnssFilterQualitySource enumerates the sources used to determine GNSS data quality,
  // including none, GST messages, HDOP, or manual assignment.
  enum GnssFilterQualitySource {
    // Unspecified quality source.
    GNSS_FILTER_QUALITY_SOURCE_UNSPECIFIED = 0;
    // No quality information provided.
    GNSS_FILTER_QUALITY_SOURCE_NONE = 1;
    // Quality derived from GNSS GST (standard deviation of position) messages.
    GNSS_FILTER_QUALITY_SOURCE_GST = 2;
    // Quality set manually by an operator or system configuration.
    GNSS_FILTER_QUALITY_SOURCE_MANUAL = 4;
  }

  // Timestamp when the GNSS data is valid.
  sonardyne.api.common.Timestamp time_of_validity = 1;
  // Timestamp when the data was received;  set if not provided.
  optional sonardyne.api.common.Timestamp time_of_arrival = 2;
  // Latitude in radians.
  double latitude_radians = 3;
  // Longitude in radians.
  double longitude_radians = 4;
  // Altitude in metres.
  double altitude_metres = 5;
  // Horizontal position error ellipse in metres.
  sonardyne.api.common.navigation.HorizontalPositionErrorEllipse horizontal_position_error_ellipse = 6;
  // Source indicating the GNSS data quality.
  GnssFilterQualitySource quality_source = 7;
  // Reasons for rejecting this GNSS data;  empty if valid.
  GnssFilterRejectionReasons rejection_reasons = 8;
}
