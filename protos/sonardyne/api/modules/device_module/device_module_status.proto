syntax = "proto3";

import "sonardyne/api/common/unique_id.proto";

package sonardyne.api.modules.device_module;

// DeviceModuleStatus represents the overall status of the device.
message DeviceModuleStatus {
  // DeviceModuleStatus.OverallStatus represents the overall status of the device.
  enum OverallStatus {
    // Unspecified device status.
    OVERALL_STATUS_UNSPECIFIED = 0;
    // Device status is OK, no active errors or warnings.
    OVERALL_STATUS_OK = 1;
    // Device has one or more active warnings.
    OVERALL_STATUS_WARNING = 2;
    // Device has one or more errors raised.
    OVERALL_STATUS_ERROR = 3;
  }

  // Unique ID of the device.
  sonardyne.api.common.UniqueID uid = 1;
  // Overall status of the device.
  OverallStatus overall_status = 2;
}
