syntax = "proto3";

package sonardyne.api.modules.output_message_module;

// OutputMessageType enumerates the different types of output messages
// that can be produced by an output message module. The default value
// is unspecified if the field is not populated.
enum OutputMessageType {
  // Unspecified output message type.
  OUTPUT_MESSAGE_TYPE_UNSPECIFIED = 0;
  // HNAV message type.
  OUTPUT_MESSAGE_TYPE_HNAV = 1;
  // SON2 message type.
  OUTPUT_MESSAGE_TYPE_SON2 = 2;
  // GGA message type.
  OUTPUT_MESSAGE_TYPE_GGA = 3;
  // PSONNAV message type.
  OUTPUT_MESSAGE_TYPE_PSONNAV = 4;
  // ZDA message type.
  OUTPUT_MESSAGE_TYPE_ZDA = 5;
  // LNAV message type.
  OUTPUT_MESSAGE_TYPE_LNAV = 6;
  // LNAVUTC message type.
  OUTPUT_MESSAGE_TYPE_LNAVUTC = 7;
  // TSS1 message type.
  OUTPUT_MESSAGE_TYPE_TSS1 = 8;
  // TSS2 message type.
  OUTPUT_MESSAGE_TYPE_TSS2 = 9;
  // EM3000 message type.
  OUTPUT_MESSAGE_TYPE_EM3000 = 10;
  // HDT message type.
  OUTPUT_MESSAGE_TYPE_HDT = 11;
  // PD4 message type.
  OUTPUT_MESSAGE_TYPE_PD4 = 12;
  // PD0 message type.
  OUTPUT_MESSAGE_TYPE_PD0 = 13;
  // PSONDIGI message type.
  OUTPUT_MESSAGE_TYPE_PSONDIGI = 14;
  // KMBinary message type.
  OUTPUT_MESSAGE_TYPE_KM_BINARY = 15;
  // GLL message type.
  OUTPUT_MESSAGE_TYPE_GLL = 16;
  // XLHNAV message type.
  OUTPUT_MESSAGE_TYPE_XLHNAV = 17;
  // SONDV message type.
  OUTPUT_MESSAGE_TYPE_SONDV = 18;
  // HNAV Version 2 message type.
  OUTPUT_MESSAGE_TYPE_HNAV_V2 = 19;
  // AUVG3000 message type.
  OUTPUT_MESSAGE_TYPE_AUVG3000 = 20;
  // PSIMSSB message type.
  OUTPUT_MESSAGE_TYPE_PSIMSSB = 21;
  // PSONALL message type.
  OUTPUT_MESSAGE_TYPE_PSONALL = 22;
  // XLHNAV V1 message type.
  OUTPUT_MESSAGE_TYPE_XLHNAV_V1 = 23;
}
